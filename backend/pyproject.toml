[project]
name = "irrigai-backend"
version = "1.0.0"
description = "Backend API for Irrigai system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn>=0.51.0",
    "pydantic-settings>=2.14.0",
    "prisma>=0.15.0",
    "supabase>=2.31.0",
    "pyjwt[crypto]>=2.10.0",
    "h3>=4.5.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true
package = false